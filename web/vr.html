<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HUD PROFESOR VR</title>
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: 'Courier New', monospace; overflow: hidden; }
        .view { display: flex; width: 100vw; height: 100vh; }
        .eye { position: relative; width: 50%; height: 100%; border-right: 1px solid #222; overflow: hidden; }
        
        /* Stream z ESP32-CAM */
        .stream { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        
        /* Liczniki po lewej na dole */
        .osd-box { 
            position: absolute; bottom: 30px; left: 30px; z-index: 2; 
            background: rgba(0, 40, 0, 0.6); padding: 15px; 
            border-left: 5px solid #0f0; border-radius: 0 10px 10px 0;
            pointer-events: none;
        }
        .label { font-size: 14px; color: #0f0; margin-bottom: 2px; }
        .value { font-size: 32px; font-weight: bold; color: #fff; margin-bottom: 10px; }
        
        #fs-btn { 
            position: fixed; top: 10px; left: 50%; transform: translateX(-50%); 
            z-index: 100; padding: 12px 24px; background: #040; color: #fff; 
            border: 2px solid #0f0; border-radius: 5px; cursor: pointer;
        }
    </style>
</head>
<body>
    <button id="fs-btn" onclick="document.documentElement.requestFullscreen(); this.style.display='none';">AKTYWUJ VR</button>
    
    <div class="view">
        <div class="eye">
            <img class="stream" src="http://192.168.4.1/">
            <div class="osd-box">
                <div class="label">NAPĘD</div>
                <div class="value pwmM">0</div>
                <div class="label">SKRĘT</div>
                <div class="value pwmS">0</div>
            </div>
        </div>

        <div class="eye">
            <img class="stream" src="http://192.168.4.1/">
            <div class="osd-box">
                <div class="label">NAPĘD</div>
                <div class="value pwmM">0</div>
                <div class="label">SKRĘT</div>
                <div class="value pwmS">0</div>
            </div>
        </div>
    </div>

    <script>
        // WPISZ TU IP TWOJEGO NODEMCU (Z SERIAL MONITORA)
        const NODE_IP = "192.168.4.2"; 

        async function update() {
            try {
                const response = await fetch(`http://${NODE_IP}/data`);
                const d = await response.json();

                document.querySelectorAll('.pwmM').forEach(el => el.innerText = d.pwmM);
                document.querySelectorAll('.pwmS').forEach(el => el.innerText = d.pwmS);
            } catch (e) { console.log("Błąd połączenia z NodeMCU"); }
        }
        setInterval(update, 50);
    </script>
</body>
</html>
